# AgroPulse: сайт + Telegram-бот
#   docker compose up -d --build
# Сайт слушает порт WEB_PORT (по умолчанию 8080) — поставьте перед ним nginx/Caddy хоста с доменом и HTTPS.

services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: agropulse-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: ./bot
    container_name: agropulse-bot
    restart: unless-stopped
    env_file: ./bot/.env
    environment:
      DATA_DIR: /app/data
    volumes:
      - bot-data:/app/data
    logging: *logging

volumes:
  bot-data:
