# Кэш кусков карты типов земель ESA WorldCover (файлы по 50–100 МБ читаются кусками по 1 МБ)
proxy_cache_path /var/cache/nginx/worldcover levels=1:2 keys_zone=worldcover:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Сайт — один файл; браузер перепроверяет его при каждом открытии, чтобы обновления были видны сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ESA WorldCover 10 м (открытые данные на AWS). У бакета нет CORS, поэтому браузер
    # читает его через этот же сервер: /worldcover/ESA_WorldCover_10m_2021_v200_N42E075_Map.tif
    location /worldcover/ {
        slice 1m;
        proxy_cache worldcover;
        proxy_cache_key $uri$slice_range;
        proxy_set_header Range $slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_set_header Host esa-worldcover.s3.eu-central-1.amazonaws.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_pass https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/;
        add_header Access-Control-Allow-Origin "*";
        add_header X-Cache $upstream_cache_status;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
